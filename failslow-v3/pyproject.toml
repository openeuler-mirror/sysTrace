[project]
name = "systrace-failslow"
version = "1.3.0"
description = "Fail Slow Detection for AI Model Training and Inference"
requires-python = ">=3.10"
authors = [{ name = "bin huang", email = "huangbin58@huawei.com" }]
keywords = ["Fail Slow Detection", "Group Compare", "AI Model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.22.4",
    "pandas>=2.2.2",
    "pydantic>=1.10.0",
    "scipy>=1.12.0",
    "matplotlib>=3.7.1",
]

[project.urls]
Homepage = "https://gitcode.com/openeuler/sysTrace"

[project.scripts]
systrace-failslow = "failslow.entrypoints.main:main"
systrace-failslow-server = "failslow.entrypoints.multi_node_server:main"
systrace-failslow-agent = "failslow.entrypoints.multi_node_agent:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["failslow*"]
exclude = ["tests*", "test*"]
