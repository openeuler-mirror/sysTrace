[project]
name = "systrace-workspace"
version = "1.3.0"
description = "sysTrace Python workspace: failslow detection and MCP server"
requires-python = ">=3.10"

# 根仅作为 uv workspace 容器，本身不产出可安装包
[tool.uv]
package = false
index-url = "https://mirrors.huaweicloud.com/repository/pypi/simple/"
environments = ["sys_platform == 'linux'"]

[tool.uv.workspace]
members = ["failslow-v3", "systrace_mcp"]
